<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raddo Play Store Icon</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        width: 512px;
        height: 512px;
        margin: 0;
        overflow: hidden;
        place-items: center;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 31, 69, 0.3), transparent 31%),
          radial-gradient(circle at 62% 30%, rgba(59, 130, 246, 0.12), transparent 35%),
          linear-gradient(145deg, #020409 0%, #090e19 54%, #020409 100%);
      }

      .disc {
        position: relative;
        width: 438px;
        height: 438px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 31, 69, 0.2), transparent 36%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 28%),
          #090b12;
      }

      .disc::before {
        content: "";
        position: absolute;
        inset: 1px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: inherit;
      }

      .ring {
        position: absolute;
        left: 135px;
        top: 115px;
        width: 246px;
        height: 246px;
        border: 35px solid rgba(255, 31, 69, 0.28);
        border-left-color: transparent;
        border-bottom-color: transparent;
        border-radius: 999px;
        transform: rotate(-20deg);
      }

      .ring.small {
        left: 170px;
        top: 152px;
        width: 176px;
        height: 176px;
        border-width: 26px;
        opacity: 0.82;
      }

      .mark {
        position: absolute;
        left: 128px;
        top: 166px;
        width: 224px;
        height: 224px;
        border: 52px solid #ff1f45;
        border-right-color: transparent;
        border-bottom-color: transparent;
        border-radius: 999px;
        filter: drop-shadow(0 0 28px rgba(255, 31, 69, 0.55));
        transform: rotate(-45deg);
      }

      .mark::after {
        content: "";
        position: absolute;
        right: -52px;
        bottom: -52px;
        width: 78px;
        height: 52px;
        background: #ff1f45;
        transform: rotate(45deg) translate(22px, -5px);
      }

      .center {
        position: absolute;
        left: 226px;
        top: 234px;
        width: 58px;
        height: 58px;
        border-radius: 999px;
        background: #ff1f45;
        filter: drop-shadow(0 0 22px rgba(255, 31, 69, 0.8));
      }

      .sweep {
        position: absolute;
        left: 252px;
        top: 159px;
        width: 146px;
        height: 22px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff1f45 0%, rgba(255, 255, 255, 0.82) 48%, rgba(255, 255, 255, 0) 100%);
        filter: drop-shadow(0 0 18px rgba(255, 31, 69, 0.7));
        transform: rotate(-46deg);
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div class="disc">
      <div class="ring"></div>
      <div class="ring small"></div>
      <div class="mark"></div>
      <div class="center"></div>
      <div class="sweep"></div>
    </div>
  </body>
</html>
